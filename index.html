<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              plex: {
                bg: '#1f2126', // Main background
                sidebar: '#17191c', // Sidebar darker
                orange: '#e5a00d', // Brand color
                card: '#282a2d', // Card background
                hover: '#3a3d42',
                text: '#e5e5e5',
                muted: '#9ca3af'
              }
            },
            fontFamily: {
              sans: ['Inter', '"Noto Sans Khmer"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1f2126;
        color: #e5e5e5;
        font-family: 'Inter', 'Noto Sans Khmer', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #17191c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3d42; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e5a00d; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
